# Dataset and result paths use the roots from [paths] or environment variables.
[experiment]
name = single_alos2

[paths]
# Default Windows directories when environment variables are unset.
default_dataset_root = D:/jema2085/data/Belgica_Bank
default_output_root = D:/jema2085/data/Belgica_Bank/results

[folds]
names = jan
	feb
	mar
	nov
	dec

[io]
run_dirs = results/SA/alos2-jan
	results/SA/alos2-feb
	results/SA/alos2-mar
	results/SA/alos2-nov
	results/SA/alos2-dec
csv_files = results/BB_IO-SA-alos2-jan.csv
	results/BB_IO-SA-alos2-feb.csv
	results/BB_IO-SA-alos2-mar.csv
	results/BB_IO-SA-alos2-nov.csv
	results/BB_IO-SA-alos2-dec.csv

[model]
num_classes = 4
pretrained = True


[datamodule]
