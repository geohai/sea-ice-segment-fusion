name: sea-ice-segment-fusion
channels:
  - conda-forge
dependencies:
  # Use conda-forge for the native geospatial libraries on macOS and Windows.
  - python=3.10
  - pip
  - numpy=1.26
  - pandas=2.2
  - scipy=1.13
  - scikit-learn=1.4
  - xarray=2024.3
  - rasterio=1.3
  - rioxarray=0.15
  - matplotlib=3.8
  - pytest=8
  # Matched PyTorch / torchvision pair; Lightning is used for training.
  - pip:
      - torch==2.2.2
      - torchvision==0.17.2
      - pytorch-lightning==2.2.5
      - torchmetrics==1.3.2
